                    <li><a href="education.html">Education</a></li>

            <section id="title" class="title">
                <h2>Contact Me</h2>
            </header>

        </section>
        <div class="contact-info">
            <div class="linkedin-container">
                <a href="https://www.linkedin.com/in/emgar" target="_blank"
                    class="linkedin" id="linkedin-link">
                    <img src="../images/linkedin.png" alt="LinkedIn"
                        style="width: 34px; height: 32px;" />
                    www.linkedin.com/in/emgar
                </a>
            </div>
            <a href="mailto:mgar888@utexas.edu" class="mail" id="email-link">
                <img src="../images/mail.png" alt="Email"
                    style="width: 34px; height: 30px;" />
                mgar888@utexas.edu
            </a>
        </div>

        <div>
            <h3 class="message-heading">Or, send me a quick message:</h3>
            <form target="_blank"
                action="https://formsubmit.co/mgar888@utexas.edu" method="POST">
                <div class="form-group">
                    <label for="from" id="from-label">From:</label>
                    <input type="text" id="from" name="from" required>
                </div>
                <div class="form-group">
                    <label for="message" id="message-label">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <button type="submit">Send Mauricio this Email</button>
            </form>
        </div>
